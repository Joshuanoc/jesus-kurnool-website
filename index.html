<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stand for Jesus Kurnool - Home</title>
  <style>
    /* Reset */
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
    body, html {
      height: 100%;
      overflow-x: hidden;
      background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1470&q=80') no-repeat center center/cover;
      position: relative;
      color: white;
    }

    /* Dark overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 0;
    }

    /* Navbar */
    nav.navbar {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      padding: 12px 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(0,0,0,0.7);
    }
    nav.navbar ul {
      list-style: none;
      display: flex;
      justify-content: center;
      gap: 2.5rem;
      font-weight: 600;
      font-size: 1.1rem;
    }
    nav.navbar ul li a {
      color: white;
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 8px;
      transition: background-color 0.3s ease;
      user-select: none;
    }
    nav.navbar ul li a:hover {
      background: #ff4b2b;
      box-shadow: 0 0 15px #ff4b2b;
    }

    /* Main container */
    .container {
      position: relative;
      z-index: 10;
      max-width: 720px;
      margin: 120px auto 0;
      padding: 3rem 2.5rem;
      background: rgba(0,0,0,0.5);
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(255, 75, 43, 0.7);
      text-align: center;
      animation: fadeInScale 1.6s ease forwards;
    }

    /* Glowing heading */
    h1 {
      font-size: 3.8rem;
      font-weight: 900;
      letter-spacing: 10px;
      color: #fff;
      text-transform: uppercase;
      text-shadow:
        0 0 8px #ff4b2b,
        0 0 20px #ff4b2b,
        0 0 40px #ff4b2b,
        0 0 60px #ff4b2b;
      animation: glowPulse 3s ease-in-out infinite alternate;
      margin-bottom: 1rem;
    }

    @keyframes glowPulse {
      0% {
        text-shadow:
          0 0 10px #ff416c,
          0 0 25px #ff416c,
          0 0 40px #ff416c,
          0 0 60px #ff416c;
      }
      100% {
        text-shadow:
          0 0 20px #ff4b2b,
          0 0 40px #ff4b2b,
          0 0 60px #ff4b2b,
          0 0 90px #ff4b2b;
      }
    }

    /* Subtitle */
    p.subtitle {
      font-size: 1.4rem;
      color: #f1f1f1cc;
      font-weight: 600;
      margin-bottom: 3rem;
      animation: fadeInText 2.5s ease forwards;
    }

    @keyframes fadeInText {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Button */
    .btn {
      position: relative;
      background: linear-gradient(45deg, #ff416c, #ff4b2b);
      border: none;
      border-radius: 50px;
      padding: 16px 60px;
      color: white;
      font-size: 1.3rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(255, 75, 43, 0.75);
      overflow: hidden;
      transition: all 0.3s ease;
      user-select: none;
      outline: none;
      animation: fadeInText 3s ease forwards;
      z-index: 1;
    }
    .btn:hover {
      box-shadow: 0 20px 40px rgba(255, 75, 43, 0.9);
      transform: scale(1.1);
    }
    /* Button shine effect */
    .btn::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        120deg,
        rgba(255, 255, 255, 0.2) 0%,
        rgba(255, 255, 255, 0.5) 50%,
        rgba(255, 255, 255, 0.2) 100%
      );
      transform: rotate(45deg);
      animation: shine 2.5s linear infinite;
      pointer-events: none;
      filter: blur(3px);
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 0;
    }
    .btn:hover::before {
      opacity: 1;
    }
    @keyframes shine {
      0% {
        transform: rotate(45deg) translateX(-200%);
      }
      100% {
        transform: rotate(45deg) translateX(200%);
      }
    }

    /* Animations */
    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Responsive */
    @media (max-width: 650px) {
      h1 {
        font-size: 2.8rem;
        letter-spacing: 5px;
      }
      p.subtitle {
        font-size: 1.1rem;
        margin-bottom: 2rem;
      }
      .btn {
        padding: 14px 45px;
        font-size: 1.1rem;
      }
    }

  </style>
</head>
<body>
  <nav class="navbar">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="events.html">Events</a></li>
      <li><a href="prayer.html">Prayer</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="lyrics.html">Lyrics</a></li> 
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <div class="container">
    <h1>Stand for Jesus Kurnool</h1>
    <p class="subtitle">Connecting the community through faith, hope, and love.</p>
    <button class="btn" onclick="location.href='about.html'">Learn More</button>
  </div>
</body>
</html>
